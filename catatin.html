<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pencatatan Keuangan</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-counter { border: none; border-radius: 12px; }
        .bg-income { background: linear-gradient(135deg, #28a745, #20c997); }
        .bg-expense { background: linear-gradient(135deg, #dc3545, #fd7e14); }
        .bg-balance { background: linear-gradient(135deg, #0d6efd, #0dcaf0); }
        .text-income { color: #198754; font-weight: bold; }
        .text-expense { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-wallet2 me-2"></i>Catatan Keuangan Ku</span>
        </div>
    </nav>

    <div class="container pb-5">
        <!-- Kartu Ringkasan Keuangan -->
        <div class="row g-3 mb-4 text-white">
            <div class="col-md-4">
                <div class="card card-counter bg-balance shadow-sm p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <small class="text-uppercase fw-bold opacity-75">Sisa Saldo</small>
                            <h3 class="mb-0 mt-1" id="totalBalance">Rp 0</h3>
                        </div>
                        <i class="bi bi-bank fs-1 opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-counter bg-income shadow-sm p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <small class="text-uppercase fw-bold opacity-75">Total Pemasukan</small>
                            <h3 class="mb-0 mt-1" id="totalIncome">Rp 0</h3>
                        </div>
                        <i class="bi bi-arrow-down-left-circle fs-1 opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-counter bg-expense shadow-sm p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <small class="text-uppercase fw-bold opacity-75">Total Pengeluaran</small>
                            <h3 class="mb-0 mt-1" id="totalExpense">Rp 0</h3>
                        </div>
                        <i class="bi bi-arrow-up-right-circle fs-1 opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Form Input Transaksi -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white py-3 border-0">
                        <h5 class="card-title mb-0 fw-bold"><i class="bi bi-plus-circle me-2"></i>Tambah Transaksi</h5>
                    </div>
                    <div class="card-body">
                        <form id="transactionForm">
                            <div class="mb-3">
                                <label class="form-label">Jenis Transaksi</label>
                                <select class="form-select" id="type" required>
                                    <option value="income">Pemasukan (+)</option>
                                    <option value="expense" selected>Pengeluaran (-)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Keterangan / Nama</label>
                                <input type="text" class="form-control" id="description" placeholder="Contoh: Gaji, Makan Siang" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Nominal (Rp)</label>
                                <input type="number" class="form-control" id="amount" placeholder="0" min="1" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Kategori</label>
                                <select class="form-select" id="category" required>
                                    <option value="Gaji / Utama">Gaji / Utama</option>
                                    <option value="Makanan & Minuman">Makanan & Minuman</option>
                                    <option value="Transportasi">Transportasi</option>
                                    <option value="Belanja">Belanja</option>
                                    <option value="Tagihan & Utilitas">Tagihan & Utilitas</option>
                                    <option value="Hiburan">Hiburan</option>
                                    <option value="Lain-lain" selected>Lain-lain</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tanggal</label>
                                <input type="date" class="form-control" id="date" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 font-weight-bold">Simpan Transaksi</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabel Riwayat Transaksi -->
            <div class="col-md-8">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0 fw-bold"><i class="bi bi-clock-history me-2"></i>Riwayat Transaksi</h5>
                        <button class="btn btn-sm btn-outline-danger" onclick="clearAllData()"><i class="bi bi-trash me-1"></i>Hapus Semua</button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Tanggal</th>
                                        <th>Keterangan</th>
                                        <th>Kategori</th>
                                        <th class="text-end">Nominal</th>
                                        <th class="text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="transactionList">
                                    <!-- Data transaksi akan ditampilkan di sini -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        // Inisialisasi data dari LocalStorage
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        // Element DOM
        const transactionForm = document.getElementById('transactionForm');
        const transactionList = document.getElementById('transactionList');
        const totalBalance = document.getElementById('totalBalance');
        const totalIncome = document.getElementById('totalIncome');
        const totalExpense = document.getElementById('totalExpense');
        const dateInput = document.getElementById('date');

        // Set tanggal default ke hari ini
        dateInput.valueAsDate = new Date();

        // Format angka ke Rupiah
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
        }

        // Fungsi Render / Tampilkan Data
        function render() {
            transactionList.innerHTML = '';
            
            let incomeSum = 0;
            let expenseSum = 0;

            if (transactions.length === 0) {
                transactionList.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">Belum ada catatan transaksi.</td></tr>`;
            } else {
                // Urutkan dari transaksi terbaru
                transactions.sort((a, b) => new Date(b.date) - new Date(a.date));

                transactions.forEach((item, index) => {
                    const isIncome = item.type === 'income';
                    const amountClass = isIncome ? 'text-income' : 'text-expense';
                    const symbol = isIncome ? '+' : '-';

                    if (isIncome) incomeSum += item.amount;
                    else expenseSum += item.amount;

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><small class="text-muted">${item.date}</small></td>
                        <td><span class="fw-semibold">${item.description}</span></td>
                        <td><span class="badge bg-light text-dark border">${item.category}</span></td>
                        <td class="text-end ${amountClass}">${symbol} ${formatRupiah(item.amount)}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-link text-danger p-0" onclick="deleteTransaction(${index})">
                                <i class="bi bi-x-circle-fill"></i>
                            </button>
                        </td>
                    `;
                    transactionList.appendChild(row);
                });
            }

            // Update Ringkasan Kartu
            const balance = incomeSum - expenseSum;
            totalBalance.textContent = formatRupiah(balance);
            totalIncome.textContent = formatRupiah(incomeSum);
            totalExpense.textContent = formatRupiah(expenseSum);
        }

        // Tambah Transaksi
        transactionForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const newTransaction = {
                id: Date.now(),
                type: document.getElementById('type').value,
                description: document.getElementById('description').value,
                amount: parseFloat(document.getElementById('amount').value),
                category: document.getElementById('category').value,
                date: document.getElementById('date').value
            };

            transactions.push(newTransaction);
            saveAndRender();
            
            // Reset form input
            document.getElementById('description').value = '';
            document.getElementById('amount').value = '';
        });

        // Hapus Satu Transaksi
        function deleteTransaction(index) {
            transactions.splice(index, 1);
            saveAndRender();
        }

        // Hapus Semua Transaksi
        function clearAllData() {
            if (confirm('Apakah Anda yakin ingin menghapus SELURUH data keuangan?')) {
                transactions = [];
                saveAndRender();
            }
        }

        // Simpan ke LocalStorage & Update Tampilan
        function saveAndRender() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
            render();
        }

        // Jual Tampilan Pertama kali
        render();
    </script>
</body>
</html>
